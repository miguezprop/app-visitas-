[build]
  publish = "."
  functions = "netlify/functions"

# 11:00 UTC = 8:00 AM hora Argentina (todo el año, sin horario de verano)
[functions."recordatorio-diario"]
  schedule = "0 11 * * *"

# cada 15 minutos, para detectar visitas que empiezan en ~1 hora
[functions."recordatorio-hora"]
  schedule = "*/15 * * * *"

# cada 15 minutos, para detectar visitas que empiezan en ~2 horas
[functions."recordatorio-2horas"]
  schedule = "*/15 * * * *"
